name: Test and build Windows mod

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Prediction and shortcut tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run standalone tests
        shell: bash
        run: |
          for src in tests/*_test.cpp; do
            exe="$RUNNER_TEMP/$(basename "$src" .cpp)"
            echo "Testing $src"
            g++ -std=c++23 -Wall -Wextra -pedantic "$src" -o "$exe"
            "$exe"
          done

  build:
    name: Package Windows mod
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the Geode SDK from mod.json
        id: build
        uses: geode-sdk/build-geode-mod@61a56c697aea9655e3f31c6c1b83870431f30434
        with:
          sdk: given
          target: Win64
      - uses: actions/upload-artifact@v4
        with:
          name: Click-Before-Frames-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
