name: Build and publish geode
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
      - name: Publish the .geode to this branch
        shell: bash
        run: |
          mkdir -p builds
          find "${{ steps.build.outputs.build-output }}" -name '*.geode' -exec cp {} builds/ \;
          ls -la builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds
          git commit -m "ci: built .geode [skip ci]"
          git push origin HEAD:arena/81a063df-predictive-input-buffer-better
